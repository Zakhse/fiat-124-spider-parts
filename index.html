<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Fiat 124 Spider Parts Catalog</title>
  <link rel="stylesheet" href="catalog.css">
  <script defer src="resources.js"></script>
  <script defer src="details.js"></script>
  <script defer src="fitment.js"></script>
  <script defer src="vin-data.js"></script>
  <script defer src="vin.js"></script>
  <script defer src="synonyms.js"></script>
  <script defer src="catalog.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <a class="brand" id="brand" href="#year=2020">
        <span class="brand-emblem"><img src="brand/fiat.png" alt=""></span>
        <span>Fiat 124 Spider<small>Parts Catalog</small></span>
      </a>
      <nav class="navigation" id="years" aria-label="Model year"></nav>
      <form id="search" role="search">
        <label class="sr-only" for="query">Part number or name</label>
        <div class="search-field">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>
          </svg>
          <input id="query" name="q" type="search" placeholder="Part number or name" autocomplete="off" spellcheck="false">
        </div>
        <button class="button primary" type="submit">Search</button>
      </form>
    </div>
    <div class="toolbar">
      <div class="toolbar-content">
        <div class="filters">
          <label>Market
            <select id="market">
              <option value="">All markets</option>
              <option value="U">US</option>
              <option value="C">Canada</option>
              <option value="M">Mexico</option>
              <option value="B">Export</option>
            </select>
          </label>
        </div>
        <div class="toolbar-actions">
          <a class="text-action" id="vehicle-codes" href="#year=2020&view=vehicle">Vehicle Codes</a>
          <a class="text-action" id="document-library" href="#year=2020&view=documents">Documents</a>
        </div>
      </div>
    </div>
    <div class="vin-bar">
      <form id="vin-form" novalidate>
        <label for="vin">Filter by VIN</label>
        <input id="vin" type="text" minlength="17" maxlength="17" spellcheck="false" autocapitalize="characters"
          autocomplete="off" aria-describedby="vin-status" placeholder="17-character VIN">
        <button class="button outline" type="submit">Apply VIN</button>
        <button class="button outline" type="button" id="clear-vin" hidden>Clear VIN</button>
      </form>
      <p id="vin-status" role="status"></p>
      <details class="vin-build" id="vin-build" hidden>
        <summary>VIN Information</summary>
        <div id="vin-equipment"></div>
      </details>
      <div class="vin-options" id="vin-options" hidden>
        <label id="vin-series-label">Trim
          <select id="vin-series">
            <option value="">Unknown</option><option value="H">Classica</option><option value="S">Lusso</option><option value="X">Abarth</option>
          </select>
        </label>
        <label id="vin-transmission-label">Transmission
          <select id="vin-transmission">
            <option value="">Unknown</option><option value="DAF">6-speed automatic</option><option value="DAG">6-speed manual</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <div class="layout" id="layout">
    <button class="button outline" id="section-toggle" type="button" aria-expanded="false" aria-controls="sidebar">Catalog sections</button>
    <aside class="sidebar" id="sidebar" aria-label="Catalog sections"></aside>
    <main id="main"><p class="notice" role="status">Loading catalog…</p></main>
    <footer class="source">Chrysler EPC5 · September 2020</footer>
  </div>
  <noscript>JavaScript is required to browse the catalog.</noscript>
</body>
</html>
